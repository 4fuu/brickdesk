name: target

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: target-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/brickdesk-toolchain
  TAG: "20231018"

jobs:
  device-scripts:
    name: device scripts (no hardware)
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
      - name: Run fake-adb device script tests
        run: ./scripts/device/test/run-tests.sh

  toolchain:
    name: toolchain image and target build
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push toolchain image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ci/Dockerfile.toolchain
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.TAG }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Show image digest
        run: echo "pushed ${{ env.IMAGE }}:${{ env.TAG }}@${{ steps.build.outputs.digest }}"

      - name: Cross-compile target artifacts
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD:/src" -w /src \
            "$IMAGE:$TAG" ./scripts/build-target.sh

      - name: Verify brickdesk target and GLIBC symbols
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD:/src" -w /src \
            "$IMAGE:$TAG" sh -c '
              test -x build-target/brickdesk
              test -x build-target/brickdesk-inputd
              test -x build-target/brickdesk-perfd
              test -x build-target/bd-input
              test -f build-target/libbrickdesk-menu.so
              file build-target/brickdesk build-target/brickdesk-inputd build-target/brickdesk-perfd build-target/bd-input build-target/libbrickdesk-menu.so
              if readelf -d build-target/libbrickdesk-menu.so | grep -Eq "NEEDED.*(libSDL2|libEGL|libGLESv2)"; then
                echo "libbrickdesk-menu.so must not link SDL/EGL/GLES directly" >&2
                exit 1
              fi
              ./ci/check-glibc.sh --max 2.23 \
                build-target/brickdesk \
                build-target/brickdesk-inputd \
                build-target/brickdesk-perfd \
                build-target/bd-input \
                build-target/libbrickdesk-menu.so \
                build-target/display_probe \
                build-target/dist/lib/libSDL2-2.0.so.0
            '

      - name: Verify toolchain file with an unrelated CMake project
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD:/src" -w /src \
            "$IMAGE:$TAG" sh -c '
              TRIMUI_SYSROOT=/opt/trimui/sysroot \
              cmake -S ci/toolchain-smoke -B build-target/toolchain-smoke -G Ninja \
                -DCMAKE_TOOLCHAIN_FILE=cmake/toolchain-aarch64.cmake
              cmake --build build-target/toolchain-smoke
              file build-target/toolchain-smoke/toolchain_smoke
            '

      - name: Package target artifacts
        run: |
          tar -czf brickdesk-target-aarch64.tar.gz -C build-target/dist .
          cp build-target/glibc-report.txt ./glibc-report.txt
          sha256sum brickdesk-target-aarch64.tar.gz

      - name: Upload target artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: brickdesk-target-aarch64
          path: |
            brickdesk-target-aarch64.tar.gz
            glibc-report.txt
            build-target/display_probe
            build-target/dist
          retention-days: 30
          if-no-files-found: warn
