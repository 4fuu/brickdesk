# Host-side regression budgets for bench_render.
#
# These are deterministic checks that do not depend on wall-clock timing from
# llvmpipe. Frame times are recorded in bench JSON, but CI deliberately does
# not fail on them. Device budgets will be added after real measurements.
#
# Pixel counts are per measured frame, not totals.

[budgets]

# A settled desktop must not present anything while idle.
idle_frames_max = 0

# Idle CPU over the --idle-ms window. Host CI uses --idle-ms 3000.
idle_cpu_ms_max = 100

# Focus move damages the previous and next tile. One 168 px cell plus the
# 4 px alignment margin is about 31 KiB per tile; two tiles are about 61 KiB.
focus_repainted_pixels_max = 80000

# The 5000-item wall must stay index-bound, not manifest-bound. The viewport
# plus one-cell prefetch ring visits about 42-56 items today.
wall5000_visited_items_max = 96

# Peak RSS of the host desktop process with the default configuration. Most of
# this is Mesa/LLVM (llvmpipe), not brickdesk; see docs/performance.md.
rss_peak_kb_max = 327680

# Allowance for allocator rounding between the renderer's logical texture
# bytes and its configured cache budget.
texture_cache_slack_bytes = 0
