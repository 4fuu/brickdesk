# brickdesk 默认配置（随固件发布）。
# 不要直接改这个文件；UI 和 `brickdesk-config set` 只写 config/local.ini，
# local.ini 中的同名 key 会覆盖这里的值。
# 完整说明见 docs/config-reference.md。
[meta]
# 配置 schema 版本；升级时由 brickdesk 自动迁移。
schema_version = 1

[theme]
# 桌面为深色专用；旧配置的 light/auto 会按 dark 加载。
mode = dark
# 强调色：persimmon（柿红，默认）、coral、teal、blue、green、violet，
# 或自定义 #RRGGBB；非法值会在加载时报 file:line。
accent = persimmon
# 背景：baked（预烘焙封面底图 + 纱层，默认）或 solid（纯色）。
ambient = baked

[ui]
# 界面语言：zh-CN（默认）或 en-US。
language = zh-CN
# 是否启用过渡/焦点动画；关闭可降低 CPU 占用。
animations = true
# 顶栏/提示栏的窄条模糊；关闭后退化为渐变，省一点 GPU 带宽。
blur = true
# 时间格式：24h（默认）或 12h。
time_format = 24h
# 时钟是否显示秒。
clock_seconds = false
# 封面缩略图缓存上限，单位 MB，范围 8..512。
cover_cache_mb = 96

[display]
# 逻辑分辨率宽度，范围 320..4096；Brick Pro 为 1024。
width = 1024
# 逻辑分辨率高度，范围 240..4096；Brick Pro 为 768。
height = 768
# 刷新率，单位 Hz，范围 30..120；Brick Pro 面板为 60。
refresh_hz = 60
# 背光亮度百分比，范围 0..100。
brightness = 70

[audio]
# 系统输出音量百分比，范围 0..100。
volume = 70
# 是否静音；静音时保留音量值，恢复后回到原来的音量。
mute = false

[input]
# 方向键首次重复前的延迟，单位 ms，范围 0..2000。
repeat_delay_ms = 400
# 方向键重复间隔，单位 ms，范围 10..1000。
repeat_interval_ms = 80
# 组合键判定窗口，单位 ms，范围 10..500。
chord_window_ms = 50
# 全局长按阈值，单位 ms，范围 100..3000；单个热键可用 hold_ms 覆盖。
long_press_ms = 500
# 双击判定窗口，单位 ms，范围 100..1000。
double_tap_ms = 300

[power]
# 屏幕关闭/进入轻睡前的无操作时间；支持 ms/s/min，范围 0..24h。
sleep_after = 60s
# 轻睡多久后进入深睡（mem）；0 表示不自动深睡。
deep_sleep_after = 30s
# 电源键按住约 1 秒的动作：shutdown、reboot 或 none。
long_press_action = shutdown
# 关机前经 /dev/i2c-6 对 AXP2202 做软断开，失败回退标准关机。
safe_shutdown = true
# 低电量阈值百分比，范围 0..100。
low_battery_percent = 5
# 电量低于阈值时是否关机。
shutdown_on_low_battery = true

[plugins]
# 插件总开关。
enabled = true
# 插件目录；留空使用构建时默认值（宿主机为仓库 plugins/，
# 设备为 /mnt/SDCARD/brickdesk/plugins）。
dir =
# 所有插件常驻内存总和上限，单位 MB，范围 16..1024。
max_total_rss_mb = 128
# 插件空闲多久后停止；支持 ms/s/min，范围 0..24h。
idle_stop = 60s
# 开机后延迟多久启动插件；支持 ms/s/min，范围 0..10min。
autostart_delay = 2s

[session]
# 每个应用的存档配额，单位 MB，范围 64..4096。
state_quota_mb = 512
# 快速恢复策略：auto（默认）、always、never。
quick_resume = auto
# 最多允许多少个应用留在后台（SIGSTOP 或应用主动暂停），范围 1..8。
max_background = 3
# 后台应用的内存软上限，单位 MB，范围 128..1024；1 GB 设备建议 560。
memory_budget_mb = 560
