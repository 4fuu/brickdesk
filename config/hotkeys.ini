# 组合键。每个 [hotkey.<id>] section 是一个绑定；
# 同 id 的 section 按 key 合并，local.ini 只写改过的字段即可。
# 语法：A+B 为 chord，A,B 为序列；Key(hold:800) 为长按，Key(double) 为双击。
# 未写的可选字段使用默认值：hold_ms=500、window_ms=50、scope=global、
# suppress=false、confirm=false、repeat=false、repeat_ms=100。
[meta]
schema_version = 1

[hotkey.menu]
# 菜单键：按住 600 ms 呼出通用菜单。
combo = Menu
# 长按阈值，单位 ms，范围 50..5000。
hold_ms = 600
# 动作：打开桌面菜单。
action = menu.open
# 作用域：global 对所有前台应用生效。
scope = global
# 是否独占输入（grab + uinput 转发）；默认关闭，避免和游戏抢按键。
suppress = false

[hotkey.hint]
# 提示键：按住 Select 0.4 秒显示按键提示栏，松开即收起。
combo = Select
# 触发提示的长按阈值，单位 ms。
hold_ms = 400
# 动作：显示提示栏。
action = ui.hint
# 全局生效。
scope = global

[hotkey.screenshot]
# 截图：L1 + R1 + Start。
combo = L1+R1+Start
# chord 判定窗口，单位 ms，范围 10..500。
window_ms = 50
# 动作：保存截图。
action = builtin.screenshot
# 全局生效。
scope = global

[hotkey.performance]
# 性能档位：Select + Up。
combo = Select+Up
# 交给 perfd 循环切换 profile。
action = perf.cycle
# 全局生效。
scope = global

[hotkey.return_home]
# 返回桌面：Menu + X；破坏性操作需要二次确认。
combo = Menu+X
# 动作：结束当前应用并回到桌面。
action = session.return_home
# 全局生效。
scope = global
# 触发前弹出确认对话框。
confirm = true
