# 设备/按键映射。按 vendor/product 匹配，不按 /dev/input/eventN 编号，
# 因为重启后编号会变化。值可以是 BTN_* 名称，或 ABS_HAT0X:方向 形式。
# 设备上的真实 key code 需要 bd-input --list / --learn 确认后再更新。
[meta]
schema_version = 1

[device.TrimUI Gamepad]
# USB vendor id（十六进制）。
vendor = 0x1a2c
# USB product id（十六进制）。
product = 0x0001
# 面键 A。CrossMix/原厂脚本里 A=305（BTN_EAST）、B=304（BTN_SOUTH）；
# 上机后用 bd-input --learn 再确认一次丝印与键码。
A = BTN_EAST
# 面键 B。
B = BTN_SOUTH
# 面键 X。原厂脚本里 X=308（BTN_WEST）、Y=307（BTN_NORTH）。
X = BTN_WEST
# 面键 Y。
Y = BTN_NORTH
# 左肩键。
L1 = BTN_TL
# 右肩键。
R1 = BTN_TR
# 左扳机。
L2 = BTN_TL2
# 右扳机。
R2 = BTN_TR2
# Home 键；实际键码用 bd-input --learn 确认。
Home = KEY_HOME
# Start 键。
Start = BTN_START
# Select 键。
Select = BTN_SELECT
# Menu 键。
Menu = BTN_MODE
# 十字键上。
Up = ABS_HAT0Y:-1
# 十字键下。
Down = ABS_HAT0Y:1
# 十字键左。
Left = ABS_HAT0X:-1
# 十字键右。
Right = ABS_HAT0X:1
# 电源/音量键通常属于独立的 gpio-keys 设备。即使 input.ini 没有为它
# 写 section，内置映射也会识别 KEY_POWER、KEY_VOLUMEUP、KEY_VOLUMEDOWN。
# 如果设备名/键码不同，用 bd-input --list / --learn 确认后再加 section。
