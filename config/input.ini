# 设备/按键映射。按 vendor/product 匹配，不按 /dev/input/eventN 编号，
# 因为重启后编号会变化。值可以是 BTN_* 名称，或 ABS_HAT0X:方向 形式。
# 设备上的真实 key code 需要 bd-input --list / --learn 确认后再更新。
[meta]
schema_version = 1

[device.TrimUI Gamepad]
# USB vendor id（十六进制）。
vendor = 0x1a2c
# USB product id（十六进制）。
product = 0x0001
# 面键 A。
A = BTN_SOUTH
# 面键 B。
B = BTN_EAST
# 面键 X。
X = BTN_NORTH
# 面键 Y。
Y = BTN_WEST
# 左肩键。
L1 = BTN_TL
# 右肩键。
R1 = BTN_TR
# Start 键。
Start = BTN_START
# Select 键。
Select = BTN_SELECT
# Menu 键。
Menu = BTN_MODE
# 十字键上。
Up = ABS_HAT0Y:-1
# 十字键下。
Down = ABS_HAT0Y:1
# 十字键左。
Left = ABS_HAT0X:-1
# 十字键右。
Right = ABS_HAT0X:1
