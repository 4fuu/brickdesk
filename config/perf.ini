# 性能 profile。perfd 在启动时探测实际可用频率和 governor，
# 这里只声明策略；写入 sysfs 前会在白名单内校验。
# profile 可以继承另一个 profile；inherit 链、循环和未知 profile
# 由 perfd 在应用时解析并报错。
[meta]
schema_version = 1

[perf]
# perfd 的全局档位：未申请租约、也未给应用单独指定时使用。
# 值必须是下面某一个 [profile.<name>] 的名字。
global_profile = default

[profile.default]
# 桌面空闲时的 CPU governor：schedutil（默认）、performance、ondemand、powersave。
governor = schedutil
# 最低频率，单位 kHz，范围 0..3000000。
min_khz = 408000
# 最高频率，单位 kHz，范围 0..3000000。
max_khz = 1200000
# 在线 CPU 核心数，M1 只允许 2..4。
online_cores = 4
# 内核 swappiness，范围 0..100。
swappiness = 20

[profile.auto]
# 预设 auto：跟随内核 schedutil 自动调频，沿用 default 的桌面频率上限。
# perfd 在电量 <=10% 且未充电时会把最高频率压到 816 MHz 或更低的可用档位。
inherit = default

[profile.balanced]
# 继承 profile.default，只覆盖需要变化的字段。
inherit = default
# 最高频率提高到 1.416 GHz。
max_khz = 1416000

[profile.performance]
# 继承 profile.balanced。
inherit = balanced
# 性能模式使用 performance governor。
governor = performance
# 最低频率，单位 kHz。
min_khz = 816000
# 最高频率，单位 kHz；设备支持的最高档位由 perfd 探测。
max_khz = 1800000

[profile.powersave]
# 继承 profile.default。
inherit = default
# 省电模式使用 powersave governor。
governor = powersave
# 最高频率限制在 816 MHz。
max_khz = 816000
# 只保留 2 个在线核心。
online_cores = 2

[app.org.libretro.retroarch]
# RetroArch 启动时使用 performance profile。
profile = performance

[core.snes9x]
# SNES 核心继承 performance，并限制最高频率。
inherit = performance
max_khz = 1416000

[core.pcsx_rearmed]
# PlayStation 核心继承 performance，允许满频。
inherit = performance
max_khz = 1800000
