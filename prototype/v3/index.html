<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>brickdesk — 视觉稿 v3</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/tiles.css">
<link rel="stylesheet" href="css/live.css">
<link rel="stylesheet" href="css/chrome.css">
<link rel="stylesheet" href="css/panels.css">
<link rel="stylesheet" href="css/settings.css">
<link rel="stylesheet" href="css/overlays.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="fit">
  <div class="stage" id="stage" data-theme="dark" data-accent="persimmon" data-bg="prebaked">
    <div class="ambient" id="ambient" aria-hidden="true">
      <div class="ambient-layer" id="amb0"></div>
      <div class="ambient-layer" id="amb1"></div>
    </div>
    <div class="ambient-veil" aria-hidden="true"></div>

    <div id="view">
      <div id="home" class="screen">
        <div class="wall-view" id="wallView">
          <div class="wall" id="wall"></div>
        </div>
        <div class="edge edge-l" aria-hidden="true"></div>
        <div class="edge edge-r" aria-hidden="true"></div>
        <div class="edge edge-b" aria-hidden="true"></div>
        <div id="homebar"></div>
      </div>
      <div id="settings" class="screen" hidden></div>
      <div id="appview" hidden></div>
    </div>

    <div class="scrim" id="scrim"></div>
    <aside class="panel side" id="side" aria-label="侧边栏"></aside>
    <aside class="panel quick" id="quick" aria-label="快捷设置"></aside>

    <div class="launch-layer" id="launch" hidden></div>
    <div class="dialog-layer" id="dialog"></div>

    <div class="hintbar" id="hint" aria-live="polite"></div>
    <div class="toast" id="toast"></div>
  </div>
</div>

<div id="harness">
  <div class="hgroup">
    <span class="hl">强调色</span>
    <div class="swatches" id="accents"></div>
  </div>
  <div class="hgroup">
    <span class="hl">条目</span>
    <div class="counts" id="counts"></div>
  </div>
  <button class="hbtn" id="selectBtn">按住 Select</button>
  <div class="debug" id="debug"></div>
</div>
<p id="note">
  方向键 = 十字键，Enter = A（按住不重复），Esc = B，C/V = X/Y，Q/E = L1/R1，Tab 按住 = Select，Space/S = Start，M = Menu，H/Home = Home。
  主页方向键在混合跨度间移动；按住 Select 约 0.4 秒显示按键提示；运行中的磁贴可 A 恢复、X 结束。
</p>

<script src="js/icons.js"></script>
<script src="js/data.js"></script>
<script src="js/layout.js"></script>
<script src="js/state.js"></script>
<script src="js/query.js"></script>
<script src="js/chrome.js"></script>
<script src="js/tiles.js"></script>
<script src="js/home.js"></script>
<script src="js/panels.js"></script>
<script src="js/settings.js"></script>
<script src="js/run.js"></script>
<script src="js/dialog.js"></script>
<script src="js/input.js"></script>
<script src="js/harness.js"></script>
<script src="js/app.js"></script>
</body>
</html>
