[meta]
schema_version = 1

[profile.default]
governor = schedutil
min_khz = 408000
max_khz = 1200000
online_cores = 4
swappiness = 20

[profile.auto]
inherit = default

[profile.balanced]
inherit = default
max_khz = 1416000

[profile.performance]
inherit = balanced
governor = performance
min_khz = 816000
max_khz = 1800000

[profile.powersave]
inherit = default
governor = powersave
max_khz = 816000
online_cores = 2

[profile.cycle.a]
inherit = cycle.b

[profile.cycle.b]
inherit = cycle.a

[profile.unknown_inherit]
inherit = missing_profile

[app.test.app]
profile = performance

[app.test.cycle]
profile = cycle.a

[app.test.missing]
profile = does_not_exist

[core.snes9x]
inherit = performance
max_khz = 1416000

[core.pcsx]
inherit = performance
max_khz = 1800000

[core.cycle]
inherit = cycle.a
